name: Update access
run-name: access-${{ inputs.user_id }}

on:
  workflow_dispatch:
    inputs:
      user_id:
        required: true
        type: string
      payload:
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - run: |
          git pull --rebase origin main

          cat > access.json <<'EOF'
          ${{ inputs.payload }}
          EOF

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add access.json
          git commit -m "chore: update access" || exit 0

          for i in 1 2 3; do
            git pull --rebase origin main
            git push && break

            if [ "$i" = "3" ]; then
              exit 1
            fi

            sleep $((i * 5))
          done
